<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" font-family="Inter, sans-serif">
<defs>
<linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262C35"/><stop offset="1" stop-color="#1D2229"/></linearGradient>
<linearGradient id="fillR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E5484D"/><stop offset="1" stop-color="#F06A6E"/></linearGradient>
<clipPath id="c1"><rect x="300" y="88" width="240" height="72" rx="12"/></clipPath>
<clipPath id="c2"><rect x="580" y="88" width="240" height="72" rx="12"/></clipPath>
</defs>
<rect width="1160" height="300" rx="16" fill="#0B0D10"/>
<text x="24" y="36" fill="#E8EBF0" font-size="15" font-weight="700">Hold to start / stop — stream &amp; record</text>
<text x="24" y="56" fill="#7B8492" font-size="12">Press and hold 5 s. The button fills left→right with a countdown; let go early and it drains back. No pop-ups, no second tap.</text>
<rect x="20" y="88" width="240" height="72" rx="12" fill="url(#btn)" stroke="#E5484D" stroke-opacity="0.6"/><rect x="21" y="89" width="238" height="1" fill="#fff" opacity="0.06"/>
<circle cx="46" cy="124" r="6" fill="#E5484D"/><text x="62" y="120" fill="#E8EBF0" font-size="15" font-weight="700">Stop stream</text><text x="62" y="138" fill="#7B8492" font-size="9.5" font-weight="700" letter-spacing="1.2">HOLD 5 S · LIVE 00:58:12</text>
<text x="140" y="190" fill="#7B8492" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">IDLE — LIVE</text>
<rect x="300" y="88" width="240" height="72" rx="12" fill="url(#btn)" stroke="#E5484D"/><g clip-path="url(#c1)"><rect x="300" y="88" width="96" height="72" fill="url(#fillR)" opacity="0.9"/></g>
<text x="326" y="120" fill="#fff" font-size="15" font-weight="700">Keep holding…</text><text x="326" y="138" fill="#fff" opacity="0.8" font-size="9.5" font-weight="700" letter-spacing="1.2">STOPS IN 3 S</text>
<text x="420" y="190" fill="#7B8492" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">HOLDING — 2 OF 5 S</text>
<rect x="580" y="88" width="240" height="72" rx="12" fill="url(#btn)" stroke="#E5484D"/><g clip-path="url(#c2)"><rect x="580" y="88" width="216" height="72" fill="url(#fillR)"/></g>
<text x="606" y="120" fill="#fff" font-size="15" font-weight="700">Keep holding…</text><text x="606" y="138" fill="#fff" opacity="0.85" font-size="9.5" font-weight="700" letter-spacing="1.2">STOPS IN 1 S</text>
<text x="700" y="190" fill="#7B8492" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">HOLDING — 4.5 OF 5 S</text>
<rect x="860" y="88" width="240" height="72" rx="12" fill="url(#btn)" stroke="#343B45"/><circle cx="886" cy="124" r="6" fill="#2A3038"/><text x="902" y="120" fill="#E8EBF0" font-size="15" font-weight="700">Start stream</text><text x="902" y="138" fill="#7B8492" font-size="9.5" font-weight="700" letter-spacing="1.2">HOLD 5 S · OFF AIR</text>
<text x="980" y="190" fill="#7B8492" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">DONE — STOPPED (LOGGED)</text>
<text x="24" y="240" fill="#7B8492" font-size="12">Same for Start (fills in the action colour), Record, and the WING USB recorder. Keyboard/switch users: hold Space/Enter. Releasing early, or dragging off the button, cancels. A light vibrate on phones when it fires.</text>
<text x="24" y="262" fill="#7B8492" font-size="12">Respects reduced motion: the fill still grows, without the shimmer. The hold time is a per-widget setting (3–10 s, default 5).</text>
</svg>