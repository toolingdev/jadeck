<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780"><rect width="1000" height="780" fill="#07080A"/><text x="0" y="22" font-family="Inter" font-size="18" font-weight="700" fill="#E8EBF0" text-anchor="start" letter-spacing="0">39 · Tracking: any number of cameras, one widget</text><text x="0" y="46" font-family="Inter" font-size="12" font-weight="400" fill="#8D96A5" text-anchor="start" letter-spacing="0">Each camera picks a mode for the moment: Follow one person, Pair (speaker + translator), Group (band, specials, 1–n people) or Hold. People outside the</text><text x="0" y="62" font-family="Inter" font-size="12" font-weight="400" fill="#8D96A5" text-anchor="start" letter-spacing="0">stage zone are ignored. The camera that's ON AIR only gets gentle corrections; cameras in preview reframe freely. Calibrate measures each camera's lag.</text><text x="0" y="92" font-family="Inter" font-size="13" font-weight="700" fill="#F5A524" text-anchor="start" letter-spacing="0">Desktop: speaker + translator on the pulpit cam, band on the wide cam</text><rect x="0" y="104" width="1000" height="520" rx="14" fill="#16181C" stroke="#2A2E36" stroke-width="1"/><text x="16" y="132" font-family="Inter" font-size="14" font-weight="700" fill="#E8EBF0" text-anchor="start" letter-spacing="0">Tracking</text><circle cx="90" cy="127" r="4.5" fill="#22C55E"/><text x="100" y="132" font-family="Inter" font-size="11" font-weight="700" fill="#8D96A5" text-anchor="start" letter-spacing="0.8">TRACKER · 2 CAMERAS</text><rect x="880" y="114" width="104" height="28" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="932" y="133" font-family="Inter" font-size="12" font-weight="600" fill="#E8EBF0" text-anchor="middle" letter-spacing="0">Pause all</text><rect x="16" y="152" width="476" height="432" rx="12" fill="#111317" stroke="#2A2E36" stroke-width="1"/><text x="30" y="178" font-family="Inter" font-size="13" font-weight="700" fill="#E8EBF0" text-anchor="start" letter-spacing="0">Cam 1 · Pulpit</text><rect x="408" y="164" width="70" height="22" rx="11" fill="#E5484D"/><text x="443" y="179" font-family="Inter" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6">ON AIR</text><rect x="28" y="194" width="452" height="254" rx="8" fill="#0B0C0F" stroke="#22262D" stroke-width="1"/><line x1="28" y1="394" x2="480" y2="394" stroke="#1C1F25"/><rect x="102" y="220" width="360" height="214" rx="6" fill="none" stroke="#F5A524" stroke-width="1" stroke-dasharray="5 4"/><text x="110" y="234" font-family="Inter" font-size="9" font-weight="700" fill="#F5A524" text-anchor="start" letter-spacing="0.6">STAGE ZONE</text><circle cx="208" cy="302.65" r="12.649999999999999" fill="#3A404B"/><rect x="188.45" y="318.75" width="39.099999999999994" height="71.3" rx="11.5" fill="#3A404B"/><circle cx="308" cy="309.55" r="11.55" fill="#3A404B"/><rect x="290.15" y="324.25" width="35.7" height="65.10000000000001" rx="10.5" fill="#3A404B"/><rect x="178" y="354" width="62" height="60" rx="3" fill="#2A2F38"/><circle cx="64" cy="386.6" r="6.6" fill="#262A32"/><rect x="53.8" y="395.0" width="20.4" height="37.199999999999996" rx="6.0" fill="#262A32"/><text x="42" y="440" font-family="Inter" font-size="9" font-weight="400" fill="#5E6673" text-anchor="start" letter-spacing="0">ignored</text><rect x="178" y="280" width="170" height="124" rx="4" fill="none" stroke="#22C55E" stroke-width="2"/><rect x="178" y="262" width="140.0" height="16" rx="3" fill="#22C55E"/><text x="184" y="274" font-family="Inter" font-size="10" font-weight="700" fill="#07080A" text-anchor="start" letter-spacing="0">Speaker + translator</text><text x="468" y="212" font-family="Inter" font-size="10" font-weight="400" fill="#5E6673" text-anchor="end" letter-spacing="0">tap a person to follow them</text><rect x="28" y="460" width="107" height="34" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="81.5" y="481.0" font-family="Inter" font-size="13" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Follow</text><rect x="143" y="460" width="107" height="34" rx="8" fill="#262B33" stroke="#F5A524" stroke-width="1.5"/><text x="196.5" y="481.0" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Pair</text><rect x="258" y="460" width="107" height="34" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="311.5" y="481.0" font-family="Inter" font-size="13" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Group</text><rect x="373" y="460" width="107" height="34" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="426.5" y="481.0" font-family="Inter" font-size="13" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Hold</text><text x="28" y="522" font-family="Inter" font-size="10" font-weight="700" fill="#8D96A5" text-anchor="start" letter-spacing="0.6">SHOT</text><rect x="72" y="504" width="66" height="28" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="105.0" y="522.0" font-family="Inter" font-size="11" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Close</text><rect x="144" y="504" width="66" height="28" rx="8" fill="#262B33" stroke="#F5A524" stroke-width="1.5"/><text x="177.0" y="522.0" font-family="Inter" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Waist</text><rect x="216" y="504" width="66" height="28" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="249.0" y="522.0" font-family="Inter" font-size="11" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Wide</text><circle cx="290" cy="518" r="4" fill="#E5484D"/><text x="300" y="522" font-family="Inter" font-size="11" font-weight="400" fill="#C9CED6" text-anchor="start" letter-spacing="0">Gentle moves (on air)</text><line x1="28" y1="542" x2="480" y2="542" stroke="#22262D"/><text x="28" y="560" font-family="Inter" font-size="11" font-weight="400" fill="#8D96A5" text-anchor="start" letter-spacing="0">lag 0.38 s · moves start 0.12 s after a command</text><rect x="400" y="546" width="80" height="24" rx="6" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="440" y="562" font-family="Inter" font-size="11" font-weight="600" fill="#C9CED6" text-anchor="middle" letter-spacing="0">Calibrate</text><rect x="508" y="152" width="476" height="432" rx="12" fill="#111317" stroke="#2A2E36" stroke-width="1"/><text x="522" y="178" font-family="Inter" font-size="13" font-weight="700" fill="#E8EBF0" text-anchor="start" letter-spacing="0">Cam 2 · Wide</text><rect x="912" y="164" width="58" height="22" rx="11" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="941" y="179" font-family="Inter" font-size="9" font-weight="700" fill="#8D96A5" text-anchor="middle" letter-spacing="0.5">PREVIEW</text><rect x="520" y="194" width="452" height="254" rx="8" fill="#0B0C0F" stroke="#22262D" stroke-width="1"/><line x1="520" y1="394" x2="972" y2="394" stroke="#1C1F25"/><rect x="532" y="220" width="428" height="214" rx="6" fill="none" stroke="#F5A524" stroke-width="1" stroke-dasharray="5 4"/><text x="540" y="234" font-family="Inter" font-size="9" font-weight="700" fill="#F5A524" text-anchor="start" letter-spacing="0.6">STAGE ZONE</text><circle cx="600" cy="314.45" r="10.45" fill="#3A404B"/><rect x="583.85" y="327.75" width="32.3" height="58.9" rx="9.5" fill="#3A404B"/><circle cx="670" cy="320.45" r="10.45" fill="#3A404B"/><rect x="653.85" y="333.75" width="32.3" height="58.9" rx="9.5" fill="#3A404B"/><circle cx="746" cy="314.45" r="10.45" fill="#3A404B"/><rect x="729.85" y="327.75" width="32.3" height="58.9" rx="9.5" fill="#3A404B"/><circle cx="820" cy="320.45" r="10.45" fill="#3A404B"/><rect x="803.85" y="333.75" width="32.3" height="58.9" rx="9.5" fill="#3A404B"/><circle cx="892" cy="314.45" r="10.45" fill="#3A404B"/><rect x="875.85" y="327.75" width="32.3" height="58.9" rx="9.5" fill="#3A404B"/><rect x="572" y="294" width="348" height="104" rx="4" fill="none" stroke="#22C55E" stroke-width="2"/><rect x="572" y="276" width="114.4" height="16" rx="3" fill="#22C55E"/><text x="578" y="288" font-family="Inter" font-size="10" font-weight="700" fill="#07080A" text-anchor="start" letter-spacing="0">Group · 5 people</text><rect x="520" y="460" width="107" height="34" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="573.5" y="481.0" font-family="Inter" font-size="13" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Follow</text><rect x="635" y="460" width="107" height="34" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="688.5" y="481.0" font-family="Inter" font-size="13" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Pair</text><rect x="750" y="460" width="107" height="34" rx="8" fill="#262B33" stroke="#F5A524" stroke-width="1.5"/><text x="803.5" y="481.0" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Group</text><rect x="865" y="460" width="107" height="34" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="918.5" y="481.0" font-family="Inter" font-size="13" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Hold</text><text x="520" y="522" font-family="Inter" font-size="10" font-weight="700" fill="#8D96A5" text-anchor="start" letter-spacing="0.6">SHOT</text><rect x="564" y="504" width="66" height="28" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="597.0" y="522.0" font-family="Inter" font-size="11" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Close</text><rect x="636" y="504" width="66" height="28" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="669.0" y="522.0" font-family="Inter" font-size="11" font-weight="500" fill="#AEB5C1" text-anchor="middle" letter-spacing="0">Waist</text><rect x="708" y="504" width="66" height="28" rx="8" fill="#262B33" stroke="#F5A524" stroke-width="1.5"/><text x="741.0" y="522.0" font-family="Inter" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Wide</text><circle cx="782" cy="518" r="4" fill="#22C55E"/><text x="792" y="522" font-family="Inter" font-size="11" font-weight="400" fill="#C9CED6" text-anchor="start" letter-spacing="0">Free to reframe</text><line x1="520" y1="542" x2="972" y2="542" stroke="#22262D"/><text x="520" y="560" font-family="Inter" font-size="11" font-weight="400" fill="#8D96A5" text-anchor="start" letter-spacing="0">lag 0.41 s · moves start 0.15 s after a command</text><rect x="892" y="546" width="80" height="24" rx="6" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="932" y="562" font-family="Inter" font-size="11" font-weight="600" fill="#C9CED6" text-anchor="middle" letter-spacing="0">Calibrate</text><text x="16" y="604" font-family="Inter" font-size="11" font-weight="400" fill="#5E6673" text-anchor="start" letter-spacing="0">Drag on a preview to redraw its stage zone · long-press a mode to make it this camera's default</text><text x="0" y="660" font-family="Inter" font-size="13" font-weight="700" fill="#F5A524" text-anchor="start" letter-spacing="0">When you move a camera yourself (joystick, zoom, a preset, or the camera's own remote): tracking pauses on that camera only</text><rect x="0" y="674" width="476" height="96" rx="12" fill="#111317" stroke="#2A2E36" stroke-width="1"/><text x="14" y="700" font-family="Inter" font-size="13" font-weight="700" fill="#E8EBF0" text-anchor="start" letter-spacing="0">Cam 1 · Pulpit</text><rect x="348" y="686" width="114" height="22" rx="11" fill="#2A2410" stroke="#F5A524" stroke-width="1"/><text x="405" y="701" font-family="Inter" font-size="9" font-weight="700" fill="#F5A524" text-anchor="middle" letter-spacing="0.5">PAUSED · YOU</text><text x="14" y="722" font-family="Inter" font-size="11" font-weight="400" fill="#AEB5C1" text-anchor="start" letter-spacing="0">You moved it. Nothing moves until you pick:</text><rect x="14" y="732" width="140" height="28" rx="8" fill="#1A1D23" stroke="#2A2E36" stroke-width="1"/><text x="84" y="751" font-family="Inter" font-size="12" font-weight="600" fill="#E8EBF0" text-anchor="middle" letter-spacing="0">Resume</text><rect x="162" y="732" width="180" height="28" rx="8" fill="#262B33" stroke="#F5A524" stroke-width="1.5"/><text x="252" y="751" font-family="Inter" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Keep this framing</text><text x="500" y="700" font-family="Inter" font-size="11" font-weight="400" fill="#C9CED6" text-anchor="start" letter-spacing="0">Resume: back to automatic framing.</text><text x="500" y="720" font-family="Inter" font-size="11" font-weight="400" fill="#C9CED6" text-anchor="start" letter-spacing="0">Keep this framing: keeps following, holding the person</text><text x="500" y="736" font-family="Inter" font-size="11" font-weight="400" fill="#C9CED6" text-anchor="start" letter-spacing="0">where you put them (e.g. left of centre for lyrics).</text><text x="500" y="756" font-family="Inter" font-size="11" font-weight="400" fill="#8D96A5" text-anchor="start" letter-spacing="0">Never resumes by itself. Lost someone? It holds still.</text></svg>