name: ci

on:
  push:
    branches: [main, go-port]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      update_screens:
        description: "Retake every saved screenshot (after a deliberate look change)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # No macOS runner: GitHub often has none free (jobs sit queued, then
        # get cancelled). Mac binaries are cross-built on Linux below, and the
        # tests run on a Mac before each release.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: SDK (its own module)
        working-directory: sdk/addon
        run: go vet ./... && go test -race -count=1 ./...

  # The app as people use it: a blank jadeck with the simulated rig
  # (4 cameras, vMix, Proclaim, WING), driven in Chromium and WebKit (Safari)
  # at phone, iPad and desktop sizes. See e2e/README.md.
  gui:
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: ffmpeg (the simulated cameras' video)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build web UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build jadeck (standard add-ons + MediaMTX inside) and the simulator
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBKEY: ${{ vars.PTZ_UPDATE_PUBKEY }}
        run: |
          go run ./cmd/addons-bundle --platform linux/amd64
          go run ./cmd/mediamtx-bundle linux amd64
          mkdir -p "$RUNNER_TEMP/rig"
          go build -tags addonbundle,mediamtx -ldflags "-X main.UpdatePublicKey=${PUBKEY}" -o "$RUNNER_TEMP/rig/ptz" ./cmd/ptz
          go build -o "$RUNNER_TEMP/rig/ptzsim" ./cmd/ptzsim
      - name: Browsers
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium webkit
      - name: Start jadeck + simulator
        run: e2e/start-rig.sh "$RUNNER_TEMP/rig/ptz" "$RUNNER_TEMP/rig/ptzsim" "$RUNNER_TEMP/rig/data"
      - name: Gear, screenshots, accessibility
        working-directory: e2e
        run: npx playwright test gear.spec.ts --reporter=list --update-snapshots=${{ inputs.update_screens && 'all' || 'missing' }}
      - name: Service flow and edit mode
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npx playwright test service.spec.ts editmode.spec.ts --reporter=list
      - name: Every page on every screen
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npx playwright test sweep.spec.ts --reporter=list
      - name: Every widget at every size
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npx playwright test sizes.spec.ts --workers 4 --reporter=dot
      - name: New or retaken screenshots (commit them into e2e/screens/linux)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screens-linux
          path: e2e/screens/linux/
          if-no-files-found: ignore
      - name: What went wrong (pictures, diffs, logs)
        if: ${{ failure() }}
        run: |
          cp "$RUNNER_TEMP"/rig/*.log e2e/results/ 2>/dev/null || true
          (cd e2e && node make-report.mjs) || true
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: gui-failures
          path: |
            e2e/results/
            e2e/report/
            e2e/out/sizes/report.json
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build web UI
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build all targets
        env:
          CGO_ENABLED: "0"
          GITHUB_TOKEN: ${{ github.token }}
          PUBKEY: ${{ vars.PTZ_UPDATE_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then echo "repo variable PTZ_UPDATE_PUBKEY is not set"; exit 1; fi
          mkdir dist
          for t in windows/amd64 windows/arm64 darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            # MediaMTX ships inside ptz (pinned + sha256-checked). windows/arm64
            # has no MediaMTX build: that one offers the download in Settings.
            rm -f internal/video/bundle/mediamtx.bin internal/video/bundle/LICENSE
            # The standard add-ons ship inside ptz too: each one's latest signed
            # release, this platform's program only (signature stays valid).
            go run ./cmd/addons-bundle --platform "$t"
            tags="-tags addonbundle"
            if [ "$t" != windows/arm64 ]; then
              go run ./cmd/mediamtx-bundle "$os" "$arch"
              tags="-tags addonbundle,mediamtx"
            fi
            GOOS=$os GOARCH=$arch go build -trimpath $tags \
              -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME} -X main.UpdatePublicKey=${PUBKEY} -X main.DefaultRepo=${GITHUB_REPOSITORY}" \
              -o "dist/ptz-${os}-${arch}${ext}" ./cmd/ptz
          done
          cd dist && sha256sum ptz-* > SHA256SUMS
      - name: Installers (one line per OS, pointed at this repository)
        run: |
          for f in install.sh install.ps1; do
            sed "s#__REPO__#${GITHUB_REPOSITORY}#g" "scripts/$f" > "dist/$f"
          done
      - name: Sign SHA256SUMS
        env:
          PTZ_SIGNING_KEY: ${{ secrets.PTZ_SIGNING_KEY }}
        run: |
          if [ -z "$PTZ_SIGNING_KEY" ]; then echo "secret PTZ_SIGNING_KEY is not set"; exit 1; fi
          go run ./cmd/ptzsign sign "$PTZ_SIGNING_KEY" dist/SHA256SUMS > dist/SHA256SUMS.sig
          go run ./cmd/ptzsign verify "${{ vars.PTZ_UPDATE_PUBKEY }}" dist/SHA256SUMS dist/SHA256SUMS.sig
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run (or a re-pushed tag) refreshes the files of the release
        # that's already there instead of failing.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
          fi
